{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Séries | ULYSSES</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        :root {
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --primary-glow: rgba(79, 70, 229, 0.12);

            --text-main: #0f172a;
            --text-muted: #64748b;

            --border: #e2e8f0;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --shadow-sm:
                0 1px 2px 0 rgba(0, 0, 0, 0.05);

            --shadow-md:
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 2px 4px -2px rgba(0, 0, 0, 0.05);

            --shadow-hover:
                0 12px 20px -3px rgba(0, 0, 0, 0.08),
                0 4px 6px -4px rgba(0, 0, 0, 0.03);
        }

        @media (prefers-color-scheme: dark) {

            :root {
                --bg-body: #0b0f19;
                --surface: #111827;
                --surface-hover: #1f2937;

                --primary: #6366f1;
                --primary-hover: #818cf8;

                --primary-light: rgba(99, 102, 241, 0.15);
                --primary-glow: rgba(99, 102, 241, 0.2);

                --text-main: #f8fafc;
                --text-muted: #94a3b8;

                --border: #1f2937;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;

            background: var(--bg-body);
            color: var(--text-main);

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            -webkit-font-smoothing: antialiased;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 64px;

            background: var(--surface);

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            position: sticky;
            top: 0;

            z-index: 10;

            box-shadow: var(--shadow-sm);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: var(--primary);

            text-decoration: none;

            font-size: 16px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .professor {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .voltar {
            display: flex;
            align-items: center;
            gap: 6px;

            padding: 8px 14px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius-sm);

            color: var(--text-main);

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition: all 0.2s ease;
        }

        .voltar:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            padding: 40px 20px 60px;

            flex: 1;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .cabecalho {
            margin-bottom: 32px;
        }

        .cabecalho h1 {
            font-size: 28px;
            font-weight: 800;

            letter-spacing: -0.02em;

            margin-bottom: 6px;
        }

        .cabecalho p {
            color: var(--text-muted);

            font-size: 15px;
        }

        /* =========================
           GRID
        ========================= */

        .grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 16px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius-lg);

            padding: 24px;

            text-decoration: none;

            color: inherit;

            display: flex;
            align-items: center;

            gap: 20px;

            box-shadow: var(--shadow-sm);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);

            border-color: var(--primary);

            box-shadow: var(--shadow-hover);
        }

        /* =========================
           ÍCONE
        ========================= */

        .icone {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--primary-light);

            color: var(--primary);

            border-radius: var(--radius-md);

            transition: transform 0.2s ease;
        }

        .card:hover .icone {
            transform: scale(1.06);
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .card-content {
            flex: 1;
        }

        .card-content h2 {
            font-size: 17px;

            font-weight: 700;

            margin-bottom: 5px;

            letter-spacing: -0.01em;
        }

        .card-content p {
            font-size: 13px;

            color: var(--text-muted);

            line-height: 1.5;
        }

        /* =========================
           SETA
        ========================= */

        .seta {
            color: var(--text-muted);

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .card:hover .seta {
            color: var(--primary);

            transform: translateX(4px);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            padding: 24px 20px;

            color: var(--text-muted);

            font-size: 12px;

            font-weight: 500;

            border-top: 1px solid var(--border);
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .header {
                padding: 0 20px;
            }

            .professor {
                display: none;
            }

            .container {
                padding: 24px 16px 40px;
            }

            .cabecalho h1 {
                font-size: 24px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a href="{% url 'home' %}" class="logo">

            <i data-lucide="graduation-cap"></i>

            ULYSSES

        </a>

        <div class="header-right">

            <span class="professor">
                Área do Professor
            </span>

            <a href="{% url 'home' %}" class="voltar">

                <i
                    data-lucide="arrow-left"
                    style="width:16px; height:16px;"
                ></i>

                Voltar

            </a>

        </div>

    </header>


    <!-- CONTEÚDO -->

    <main class="container">

        <div class="cabecalho">

            <h1>Selecionar Série</h1>

            <p>
                Selecione uma série para visualizar os alunos cadastrados.
            </p>

        </div>


        <div class="grid">

            {% for codigo, nome in series %}

                <a
                    href="{% url 'alunos:alunos_por_serie' codigo %}"
                    class="card"
                >

                    <div class="icone">

                        <i
                            data-lucide="school"
                            style="width:28px; height:28px;"
                        ></i>

                    </div>


                    <div class="card-content">

                        <h2>
                            {{ nome }}
                        </h2>

                        <p>
                            Visualizar alunos desta série.
                        </p>

                    </div>


                    <div class="seta">

                        <i
                            data-lucide="chevron-right"
                            style="width:20px; height:20px;"
                        ></i>

                    </div>

                </a>

            {% endfor %}

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        ULYSSES • Sistema Educacional

    </footer>


    <script>

        lucide.createIcons();

    </script>

</body>

</html>
