<div class="field {% if field.errors %}is-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <p class="help">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <div class="field-error">
            {% for error in field.errors %}{{ error }}{% endfor %}
        </div>
    {% endif %}
</div>
