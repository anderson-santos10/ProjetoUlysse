<div class="empty-state">
    {% if icon %}
        <i data-lucide="{{ icon }}" class="icon-lg" aria-hidden="true"></i>
    {% endif %}
    <h3>{{ title }}</h3>
    {% if description %}
        <p>{{ description }}</p>
    {% endif %}
    {% if action_url and action_label %}
        <p class="mt-lg">
            <a class="btn btn-primary" href="{{ action_url }}">{{ action_label }}</a>
        </p>
    {% endif %}
</div>
